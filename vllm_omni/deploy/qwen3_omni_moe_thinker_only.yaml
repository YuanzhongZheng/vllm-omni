# Qwen3-Omni-MoE thinker-only: text-output, single GPU.
# Set CUDA_VISIBLE_DEVICES=<n> externally; devices: "0" always refers to
# the one visible GPU regardless of its physical index.
async_chunk: false
pipeline: qwen3_omni_moe_thinker_only

stages:
  - stage_id: 0
    max_num_batched_tokens: 32768
    max_num_seqs: 32
    gpu_memory_utilization: 0.9
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "0"
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      top_k: 1
      max_tokens: 2048
      seed: 42
      repetition_penalty: 1.05
